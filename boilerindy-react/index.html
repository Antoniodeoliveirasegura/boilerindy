<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint (no flash). Extracted to an external
         file so the CSP can use script-src 'self' with no inline exception. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Plus Jakarta Sans 800 sets every heading, so it loads with the page; 600
         and 700 (public/fonts) swap in when first used. -->
    <link rel="preload" href="/fonts/PlusJakartaSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#050608" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BoilerIndy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoilerIndy - campus app for Purdue Indianapolis students</title>
    <meta name="description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <!-- Social preview cards (Discord, Reddit, iMessage, Twitter). The PNG icons and
         og-image.png are rendered from the light colourway of app-icon.svg by
         scripts/render-icons.mjs. favicon.svg and app-icon.svg switch to their dark
         colourway on their own under prefers-color-scheme: dark. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BoilerIndy" />
    <meta property="og:title" content="BoilerIndy - campus app for Purdue Indianapolis students" />
    <meta property="og:description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <meta property="og:url" content="https://www.boilerindy.app/" />
    <meta property="og:image" content="https://www.boilerindy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BoilerIndy - Your Purdue Indianapolis campus companion" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BoilerIndy - campus app for Purdue Indianapolis students" />
    <meta name="twitter:description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <meta name="twitter:image" content="https://www.boilerindy.app/og-image.png" />
    <!-- The sign-in page's first paint (issue #389): its panels and the form's
         shape, drawn before the app has loaded and replaced when it mounts.
         theme-init.js marks /login (data-shell) and sets the theme (.dark), from
         the saved choice or else the device's, before the body is drawn, so
         every other route paints nothing here. Plain CSS, since the app's
         stylesheet may not have loaded; the colours are the index.css tokens
         (test/signInFirstPaint.test.mjs checks they match) and the sizes are the
         form's, as SignInSkeleton.tsx draws them. -->
    <style>
      .login-shell {
        --ls-bg: #ECEDF0; --ls-bar: #E2E4E8; --ls-ink: #111419; --ls-ink-txt: #F3F4F6;
        --ls-txt-0: #0F1217; --ls-txt-2: #474E5A; --ls-line: rgba(15, 18, 23, 0.16); --ls-rule: rgba(15, 18, 23, 0.48);
        display: none;
        min-height: 100vh;
        background: var(--ls-bg);
      }
      .dark .login-shell {
        --ls-bg: #0D0F12; --ls-bar: #181B21; --ls-ink: #1B1F27;
        --ls-txt-0: #F3F4F6; --ls-txt-2: #A9B0BA; --ls-line: rgba(255, 255, 255, 0.13); --ls-rule: rgba(255, 255, 255, 0.38);
      }
      [data-shell='login'] .login-shell { display: grid; }
      .login-shell * { box-sizing: border-box; }
      .ls-aside { display: none; padding: 32px 48px; background: var(--ls-ink); }
      .ls-brand, .ls-mobile { display: flex; align-items: center; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; line-height: 1; }
      .ls-brand { gap: 10px; height: 32px; font-size: 18px; letter-spacing: -0.02em; color: var(--ls-ink-txt); }
      .ls-main { display: flex; flex-direction: column; min-width: 0; padding: 12px 16px 0; }
      .ls-top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
      .ls-back { width: 94px; height: 12px; }
      .ls-theme { width: 18px; height: 18px; margin-right: 3px; border-radius: 50%; }
      .ls-block { display: flex; flex: 1; flex-direction: column; justify-content: center; width: 100%; max-width: 420px; margin: 0 auto; padding: 32px 0; }
      .ls-mobile { gap: 12px; height: 30px; margin-bottom: 16px; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ls-txt-2); }
      .ls-mobile i { width: 1px; height: 20px; background: var(--ls-rule); }
      .login-shell img { display: block; }
      .dark .ls-on-light, html:not(.dark) .ls-on-dark { display: none; }
      .ls-bar { display: block; border-radius: 4px; background: var(--ls-bar); }
      .ls-h1 { display: flex; align-items: center; height: 27.56px; }
      .ls-h1 .ls-bar { width: 170px; height: 18px; }
      .ls-status { height: 45px; margin: 8px 0 24px; padding-top: 3px; }
      .ls-spin { display: block; width: 16px; height: 16px; border: 2px solid var(--ls-line); border-top-color: var(--ls-txt-0); border-radius: 50%; }
      .ls-seg { height: 54px; margin-bottom: 20px; }
      .ls-button { height: 44px; }
      .ls-or { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
      .ls-or::before, .ls-or::after { content: ""; flex: 1; height: 1px; background: var(--ls-line); }
      .ls-or .ls-bar { width: 112px; height: 11.5px; }
      .ls-form > * + * { margin-top: 16px; }
      .ls-label { display: flex; align-items: center; height: 19.5px; margin-bottom: 6px; }
      .ls-label .ls-bar { width: 96px; height: 12px; }
      .ls-input { height: 46px; }
      .ls-row { display: flex; align-items: center; justify-content: space-between; height: 44px; }
      .ls-row .ls-bar { width: 112px; height: 16px; }
      .ls-info { height: 96.4px; margin-top: 32px; padding-top: 25px; border-top: 1px solid var(--ls-line); }
      .ls-info .ls-bar { width: 85%; height: 13px; }
      .ls-info .ls-bar:nth-child(2) { width: 60%; margin-top: 8px; }
      .ls-info .ls-bar:nth-child(3) { width: 55%; margin-top: 20px; }
      /* The footer's disclaimer takes more lines in a narrower column; these
         are its measured heights, so a form centred above it lands where the
         page's will. */
      .ls-foot { height: 173px; margin: 0 -16px; border-top: 1px solid var(--ls-line); }
      @media (min-width: 40rem) {
        .ls-main { padding: 20px 40px 0; }
        .ls-block { padding: 48px 0; }
        .ls-foot { height: 134px; margin: 0 -40px; }
      }
      @media (min-width: 48rem) {
        .ls-h1 { height: 33.92px; }
        .ls-h1 .ls-bar { width: 210px; height: 22px; }
        .ls-seg { height: 42px; }
        .ls-input { height: 44.5px; }
        .ls-foot { height: 114px; }
      }
      @media (min-width: 64rem) {
        .login-shell { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); }
        .ls-aside { display: block; }
        .ls-main { padding-top: 26px; }
        .ls-block { padding: 32px 0; }
        .ls-mobile { display: none; }
        .ls-foot { height: 153px; }
      }
      @media (min-width: 70.5rem) {
        .ls-foot { height: 134px; }
      }
      @media (min-width: 80rem) {
        .ls-aside { padding: 32px 64px; }
      }
      @media (min-width: 101rem) {
        .ls-foot { height: 114px; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .ls-spin { animation: ls-spin 1s linear infinite; }
        .ls-bar { animation: ls-pulse 1.6s ease-in-out infinite; }
      }
      @keyframes ls-spin { to { transform: rotate(360deg); } }
      @keyframes ls-pulse { 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="login-shell" aria-hidden="true">
        <div class="ls-aside">
          <div class="ls-brand"><img src="/brand/mark-dark.svg" alt="" width="32" height="32" />BoilerIndy</div>
        </div>
        <div class="ls-main">
          <div class="ls-top"><span class="ls-bar ls-back"></span><span class="ls-bar ls-theme"></span></div>
          <div class="ls-block">
            <div class="ls-mobile">
              <img class="ls-on-light" src="/brand/mark-light.svg" alt="" width="30" height="30" />
              <img class="ls-on-dark" src="/brand/mark-dark.svg" alt="" width="30" height="30" />
              <i></i>Student app
            </div>
            <div class="ls-h1"><span class="ls-bar"></span></div>
            <div class="ls-status"><span class="ls-spin"></span></div>
            <div class="ls-bar ls-seg"></div>
            <div class="ls-bar ls-button"></div>
            <div class="ls-or"><span class="ls-bar"></span></div>
            <div class="ls-form">
              <div><div class="ls-label"><span class="ls-bar"></span></div><div class="ls-bar ls-input"></div></div>
              <div><div class="ls-label"><span class="ls-bar"></span></div><div class="ls-bar ls-input"></div></div>
              <div class="ls-row"><span class="ls-bar"></span><span class="ls-bar"></span></div>
              <div class="ls-bar ls-button"></div>
            </div>
            <div class="ls-info"><span class="ls-bar"></span><span class="ls-bar"></span><span class="ls-bar"></span></div>
          </div>
          <div class="ls-foot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
