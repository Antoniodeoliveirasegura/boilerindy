<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint (no flash). Extracted to an external
         file so the CSP can use script-src 'self' with no inline exception. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#100b04" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BoilerIndy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoilerIndy</title>
    <meta name="description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <!-- Social preview cards (Discord, Reddit, iMessage, Twitter). The PNG icons and
         og-image.png are rendered from favicon.svg by scripts/render-icons.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BoilerIndy" />
    <meta property="og:title" content="BoilerIndy" />
    <meta property="og:description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <meta property="og:url" content="https://www.boilerindy.app/" />
    <meta property="og:image" content="https://www.boilerindy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BoilerIndy - Your Purdue Indianapolis campus companion" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BoilerIndy" />
    <meta name="twitter:description" content="Your Purdue Indianapolis campus companion - schedule, dining, transit, board, and more." />
    <meta name="twitter:image" content="https://www.boilerindy.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
