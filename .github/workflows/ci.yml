name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # Lint must pass: the source is error-clean. A couple of pre-existing
      # exhaustive-deps warnings remain informational (warnings don't fail eslint).
      - name: Lint frontend
        run: pnpm run lint
        working-directory: boilerindy-react

      # Type-check the migrating TypeScript surface (issue #20). allowJs/checkJs:false
      # means only .ts/.tsx are checked, so this stays green as conversion proceeds.
      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: boilerindy-react

      # Ban the em dash (U+2014) and en dash (U+2013) repo-wide. See the
      # "Conventions" section in README.md. Uses Node (Unicode-correct and always
      # present here); grep -P's \x{} support is too environment-dependent.
      - name: No em/en dashes (use a hyphen)
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const { readFileSync } = require("node:fs");
            const files = execSync("git ls-files").toString().split("\n").filter(Boolean)
              .filter(f => !/\.(lock|svg|png|ico|webp|jpe?g|woff2?|ttf)$|pnpm-lock\.yaml$/.test(f));
            const DASH = new RegExp("[" + String.fromCharCode(0x2013, 0x2014) + "]");
            const bad = [];
            for (const f of files) {
              let t; try { t = readFileSync(f, "utf8"); } catch { continue; }
              t.split("\n").forEach((ln, i) => { if (DASH.test(ln)) bad.push(f + ":" + (i + 1) + ": " + ln.trim().slice(0, 80)); });
            }
            if (bad.length) {
              console.error("Em dash (U+2014) or en dash (U+2013) found. Use a hyphen (-). See README.md Conventions:");
              console.error(bad.slice(0, 50).join("\n"));
              process.exit(1);
            }
            console.log("No em/en dashes across " + files.length + " tracked files.");
          '

      - name: Run tests (backend + frontend)
        run: pnpm test

      - name: Build frontend
        run: pnpm run build
        working-directory: boilerindy-react

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # The Playwright config builds + previews the frontend and mocks the
      # backend at the network layer, so no Supabase secrets or Express server
      # are needed here.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
