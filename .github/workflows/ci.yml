name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            boilerindy-react/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: boilerindy-react

      - name: Lint frontend
        run: npm run lint
        working-directory: boilerindy-react

      - name: Run tests (backend + frontend)
        run: npm test

      - name: Build frontend
        run: npm run build
        working-directory: boilerindy-react
