name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # Lint must pass: the source is error-clean. A couple of pre-existing
      # exhaustive-deps warnings remain informational (warnings don't fail eslint).
      - name: Lint frontend
        run: pnpm run lint
        working-directory: boilerindy-react

      - name: Run tests (backend + frontend)
        run: pnpm test

      - name: Build frontend
        run: pnpm run build
        working-directory: boilerindy-react
