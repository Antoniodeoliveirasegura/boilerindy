name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # Lint must pass: the source is error-clean. A couple of pre-existing
      # exhaustive-deps warnings remain informational (warnings don't fail eslint).
      - name: Lint frontend
        run: pnpm run lint
        working-directory: boilerindy-react

      # Type-check the migrating TypeScript surface (issue #20). allowJs/checkJs:false
      # means only .ts/.tsx are checked, so this stays green as conversion proceeds.
      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: boilerindy-react

      - name: Run tests (backend + frontend)
        run: pnpm test

      - name: Build frontend
        run: pnpm run build
        working-directory: boilerindy-react

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # The Playwright config builds + previews the frontend and mocks the
      # backend at the network layer, so no Supabase secrets or Express server
      # are needed here.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
