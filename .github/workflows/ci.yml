name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Both jobs only read the repository: checkout, install, lint, test, build. The
# cache and artifact steps authenticate with the Actions runtime token, not
# GITHUB_TOKEN. Declaring read-only here keeps it that way even if the
# repository default changes (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# A new push to a pull request cancels the PR run it supersedes: only the latest
# head matters there. Pushes to main and develop are post-merge verification, so
# each one gets a group of its own (the run ID) and is never cancelled or held
# back. A shared group with cancel-in-progress: false would not give that:
# GitHub keeps one pending run per group and cancels the older pending run when
# a newer one arrives, so a quick batch of merges would drop the middle commits'
# runs. A push to develop still starts both its own run and a new run of the
# open develop -> main release PR: they are different events on different refs,
# so they land in different groups. The PR run tests GitHub's merge of develop
# into main (refs/pull/N/merge), not the develop head commit itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a cap a hung step holds the runner for GitHub's 6 hour default.
    # Measured 2026-09-17: the job took 43 to 86 s over the last 38 runs.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # .nvmrc holds the bare major (22). check-latest looks up the newest 22.x
      # in actions/node-versions and downloads it when the runner image is behind;
      # without it setup-node keeps whichever 22.x the image cached, which trails
      # Node security releases until GitHub rebuilds the image. Render also runs the
      # newest 22.x, through NODE_VERSION=22 (issue #185).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # The admin scripts in scripts/ are run by hand, mostly against the
      # production Supabase project, and no test imports them (only
      # scripts/lib/ is tested), so a syntax error would otherwise show up
      # mid-operation. node --check parses each file without running it and does
      # not resolve imports. find covers scripts/lib/ too, and an empty match
      # fails so a moved directory cannot turn this into a silent pass.
      - name: Syntax-check admin scripts
        shell: bash
        run: |
          count=0
          failed=0
          while IFS= read -r f; do
            count=$((count + 1))
            node --check "$f" || failed=$((failed + 1))
          done < <(find scripts -name '*.mjs' | sort)
          if [ "$count" -eq 0 ]; then
            echo "No .mjs files found under scripts/."
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "$failed of $count scripts/ files failed node --check."
            exit 1
          fi
          echo "node --check passed for $count scripts/ files."

      # Lint must pass: the source is error-clean. Covers .ts/.tsx as well as the
      # few remaining .js files (issue #183); the React Compiler advisory rules
      # stay informational warnings and don't fail eslint.
      - name: Lint frontend
        run: pnpm run lint
        working-directory: boilerindy-react

      # Type-check the migrating TypeScript surface (issue #20). allowJs/checkJs:false
      # means only .ts/.tsx are checked, so this stays green as conversion proceeds.
      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: boilerindy-react

      - name: Run tests (backend + frontend)
        run: pnpm test

      - name: Build frontend
        run: pnpm run build
        working-directory: boilerindy-react

  e2e:
    runs-on: ubuntu-latest
    # Measured 2026-09-17: 81 to 143 s over the last 38 runs, 191 s at most in
    # the last 300. The cap stops a hung preview server or browser from holding
    # the runner for GitHub's 6 hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Same Node resolution as the test job: newest 22.x, not the image cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            boilerindy-react/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: boilerindy-react

      # The Playwright config builds + previews the frontend and mocks the
      # backend at the network layer, so no Supabase secrets or Express server
      # are needed here.
      # Downloading Chromium took 38s of a 156s job. The cache key follows the
      # Playwright version pinned in the root lockfile, so a bump busts it.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser binary is cached but the OS libraries it links against are not.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The repo conventions every contributor is held to, with or without an AI
  # assistant (README "Conventions"): no em/en dashes in tracked files, no
  # Co-Authored-By trailers or "Generated with" footers that credit an AI
  # assistant, in commits or in the PR description. The same script backs the
  # committed git hooks in .githooks/, so a hit here means the author skipped
  # them. No install step: scripts/check-conventions.mjs has no dependencies.
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so the commit scan can walk the PR's commits
          # (origin/<base>..HEAD) or the pushed range. The other jobs stay shallow.
          fetch-depth: 0

      # Same Node resolution as the test job: newest 22.x, not the image cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: No em/en dashes (use a hyphen)
        run: node scripts/check-conventions.mjs dashes

      # On a push the range is the old tip..new tip from the event payload; the
      # script falls back to the head commit alone when the old tip is unknown.
      - name: No AI co-author trailers in commit messages
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/check-conventions.mjs commits

      # The description is passed through the environment, never interpolated
      # into the shell line, so its content cannot become a command.
      - name: No AI footer in the pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-conventions.mjs pr-body

  # Every db/*.sql file applied in README "Database setup" order on an empty
  # Postgres, after db/ci/prelude.sql stands in for the roles, auth schema and
  # pg_cron/pg_net objects a Supabase project has out of the box. Proves that
  # each file parses, depends only on files listed before it, and that the list
  # covers all of db/ (test/dbApplyOrder.test.mjs checks that last part without
  # a database, in pnpm test). postgres:15 is the oldest major Supabase runs.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The job's steps wait for a healthy server.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Node resolution as the test job: newest 22.x, not the image cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # ubuntu-latest ships psql; the fallback covers an image that drops it.
      - name: Ensure psql is available
        run: command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply every db/ file in README order on an empty Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node scripts/check-db-apply.mjs
